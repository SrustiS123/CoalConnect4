<!DOCTYPE html>
<html>
<head>
    <title>CoalConnect - Information Giver</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f5;
        }

        .header {
            background-color: #222222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #e69b00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #c98200;
        }

        .contact {
            margin-top: 25px;
            padding: 15px;
            background-color: #f4f6f5;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>CoalConnect</h1>
        <p>Information Giver - Submit Mine Updates</p>
    </div>

    <div class="container">

        <h2>Submit Information</h2>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter mobile number">

        <label>Mine Name</label>
        <input type="text" placeholder="Enter mine name">

        <label>Update / Information</label>
        <textarea placeholder="Enter mine update or information"></textarea>

        <label>Document / Photo</label>
        <input type="file">

        <button class="button" onclick="submitInfo()">Submit Information</button>

        <div class="contact">
            <strong>Officer Contact</strong>
            <p>Mining Information Officer</p>
            <p>Phone: 1800-000-000</p>
        </div>

    </div>

    <script>
        function submitInfo() {
            alert("Your information has been submitted for verification.");
        }
    </script>

</body>
</html>
