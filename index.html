<!DOCTYPE html>
<html>
<head>
    <title>CoalConnect - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f5;
        }

        .header {
            background-color: #222222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 40px;
        }

        .login-box {
            width: 350px;
            background-color: white;
            margin: 60px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .login-box h2 {
            text-align: center;
            color: #222222;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #e69b00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #c98200;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>CoalConnect</h1>
        <p>Connecting the Coal Industry</p>
    </div>

    <div class="login-box">

        <h2>Sign In</h2>

        <input type="text" placeholder="Username or Email">

        <input type="password" placeholder="Password">

        <button class="login-button" onclick="login()">Login</button>

    </div>
<script>
    function login() {
        const username = document.querySelector('input[type="text"]').value;
        const password = document.querySelector('input[type="password"]').value;

        if (username === "demo" && password === "1234") {
            window.location.href = "dashboard.html";
        } else {
            alert("Incorrect username or password.");
        }
    }
</script>
</body>
</html>
